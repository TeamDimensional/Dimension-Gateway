# Configuration file

general {
    # 套索的耐久度。
    # Durability of the lasso.
    I:"Lasso Durability"=1024

    # 禁止被套索捕捉的生物注册名列表，例如 minecraft:cow。
    # Blacklist of mobs that cannot be captured, e.g. minecraft:cow.
    S:"Mob Blacklist" <
     >

    # 每个等级农场生成一次掉落所需的秒数。
    # Seconds required for each farm tier to generate loot once.
    D:"Mob Farm Rate" <
        50.0
        40.0
        30.0
        20.0
        10.0
        5.0
        3.0
        1.0
     >

    # 输出失败后的重试间隔，单位 tick。默认 20。范围 1 到 3600。
    # Retry interval after output fails, in ticks. Default 20. Range 1 to 3600.
    # Min: 1
    # Max: 3600
    I:"Output Retry Interval Ticks"=20

    # 启用后，如果本轮掉落无法完整放入相邻物品容器，农场会暂停在完成前；不会扣除套索耐久，也不会把产物掉到世界中。
    # When enabled, farms pause before completing if the generated drops cannot fully fit into adjacent item handlers; no lasso durability is consumed and no items are dropped into the world.
    B:"Pause When Output Full"=true

    # 是否在客户端渲染农场内部的生物模型；当视野内有大量农场时可关闭以提升帧率。
    # Whether to render captured mob models inside mob farms on the client; disable this to improve FPS when many farms are visible.
    B:"Render Farm Mob Model"=true
}


